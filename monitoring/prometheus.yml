# monitoring/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'airflow_pipeline_metrics'
    static_configs:
      - targets: ['statsd-exporter:9102'] # Airflow -> statsd (UDP 8125) -> statsd-exporter -> Prometheus

  - job_name: 'prometheus_self_monitoring'
    static_configs:
      - targets: ['localhost:9090']
