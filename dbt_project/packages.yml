# Exact pins, not ranges. A range means a 03:00 scheduled run can execute
# macro SQL from a package version that was never tested and did not exist
# when this code was written. These are installed at image build time (see
# airflow/Dockerfile), so the pipeline fetches nothing from the dbt hub at
# runtime.
packages:
  - package: dbt-labs/dbt_utils
    version: 1.4.1
  # metaplane/ is the maintained fork; calogica/ emits a deprecation warning.
  - package: metaplane/dbt_expectations
    version: 0.10.10
